[package]
name = "fandango-targets"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[features]
default = ["static_defs"]

alpenglow = []
csv = []
evm = []
rest = []
scriptsizec = []
xml = []
yul = []
clang = []
javascript = ["static_defs", "dep:tree-sitter", "dep:tree-sitter-javascript"]

static_defs = []

[dev-dependencies]
num-rational.workspace = true
rand = { workspace = true, features = ["default"] }

[dependencies]
fandango = { path = ".." }
fandango-runtime = { path = "../runtime" }
fandango-core = { path = "../core" }

anyhow.workspace = true
embedded-io.workspace = true
hashbrown.workspace = true
num-rational.workspace = true
mappable-rc.workspace = true
tree-sitter = { version = "0.27.1", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }

[lints]
workspace = true

[[example]]
name = "alpenglow_altpath"
path = "examples/alpenglow_altpath.rs"
required-features = ["alpenglow", "static_defs"]

[[example]]
name = "xml_basic"
path = "examples/xml_basic.rs"
required-features = ["xml", "static_defs"]

[[example]]
name = "xml_multiobjective"
path = "examples/xml_multiobjective.rs"
required-features = ["xml", "static_defs"]

[[example]]
name = "c_lang"
path = "examples/c_lang.rs"
required-features = ["clang", "static_defs"]

[[example]]
name = "evm_kpath"
path = "examples/evm_kpath.rs"
required-features = ["evm", "static_defs"]

[[example]]
name = "yul_kpath"
path = "examples/yul_kpath.rs"
required-features = ["yul", "static_defs"]

[[example]]
name = "js_lang"
path = "examples/js_lang.rs"
required-features = ["javascript"]
