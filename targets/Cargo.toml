[package]
name = "fandango-targets"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

[features]
default = ["static_defs"]

csv = []
evm = []
rest = []
scriptsizec = []
xml = []
yul = []
clang = []

static_defs = []

[dev-dependencies]
num-rational.workspace = true
rand = { workspace = true, features = ["default"] }

[dependencies]
fandango = { path = ".." }
fandango-runtime = { path = "../runtime" }
fandango-core = { path = "../core" }

anyhow.workspace = true
embedded-io.workspace = true
hashbrown.workspace = true
num-rational.workspace = true
mappable-rc.workspace = true

[lints]
workspace = true

[[example]]
name = "xml_basic"
path = "examples/xml_basic.rs"
required-features = ["xml", "static_defs"]

[[example]]
name = "xml_multiobjective"
path = "examples/xml_multiobjective.rs"
required-features = ["xml", "static_defs"]

[[example]]
name = "c_lang"
path = "examples/c_lang.rs"
required-features = ["clang", "static_defs"]

[[example]]
name = "evm_kpath"
path = "examples/evm_kpath.rs"
required-features = ["evm", "static_defs"]

[[example]]
name = "yul_kpath"
path = "examples/yul_kpath.rs"
required-features = ["yul", "static_defs"]
